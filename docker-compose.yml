
services:
  app:
    build: .
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - '8000:80'        # backend at http://localhost:8000
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: database
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - '3306:3306'      # optional: for GUI tools

volumes:
  dbdata:
